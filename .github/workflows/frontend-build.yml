name: Frontend build

on:
  push:
    branches: [feat/fe-02-color-palette]
  pull_request:
    branches: [main]
    paths:
      - 'FRONTEND/client/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FRONTEND/client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONTEND/client/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build (warnings are non-blocking per existing script)
        run: npm run build
