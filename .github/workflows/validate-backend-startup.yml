name: Validate backend

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout revision under review
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
      - name: Record checked-out revision
        run: git rev-parse HEAD
      - name: Check backend JavaScript syntax
        run: find BACKEND -path '*/node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n 1 node --check
      - name: Install backend dependencies
        working-directory: BACKEND
        run: npm ci --include=dev --no-audit --no-fund
      - name: Run backend Jest suite
        working-directory: BACKEND
        env:
          NODE_ENV: test
        run: npm test -- --ci
