<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B54735" />
    <meta
      name="description"
      content="table2Talk — Condividi un tavolo in video o dal vivo e crea nuove connessioni."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>table2Talk</title>
    <!-- Retrocompatibilità link senza hash: /meals/123 → /#/meals/123 (HashRouter).
         Solo su web (http/https) e mai per index.html o asset statici. -->
    <script>
      (function () {
        try {
          var loc = window.location;
          var isWeb = loc.protocol === 'http:' || loc.protocol === 'https:';
          var p = loc.pathname || '/';
          var isAsset = p === '/index.html' || p.indexOf('/static/') === 0 || p.indexOf('.') !== -1;
          if (isWeb && !loc.hash && p !== '/' && !isAsset) {
            loc.replace(loc.origin + '/#' + p + loc.search);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Configurazione per accesso remoto -->
    <script src="%PUBLIC_URL%/config.js"></script>
  </head>
  <body>
    <noscript>Devi abilitare JavaScript per usare questa applicazione.</noscript>
    <style>
      /* Placeholder di caricamento iniziale (prima che React monti) */
      #app-loader { 
        position: fixed; 
        inset: 0; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background: #FAF7F2; 
        z-index: 99999; 
        visibility: visible !important;
        opacity: 1 !important;
      }
      #app-loader .spinner { 
        width: 48px; 
        height: 48px; 
        border: 6px solid #DDD5CA; 
        border-top: 6px solid #B54735; 
        border-radius: 50%; 
        animation: spin 1s linear infinite; 
      }
      #app-loader .label { 
        margin-top: 10px; 
        font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Poppins', sans-serif; 
        color: #5C625C; 
        font-size: 14px; 
        text-align: center; 
      }
      #app-loader .wrap { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
      }
      @keyframes spin { 
        0% { transform: rotate(0deg);} 
        100% { transform: rotate(360deg);} 
      }
      #root {
        min-height: 100vh;
        background: #FAF7F2;
        position: relative;
        z-index: 1;
      }
      body {
        background: #FAF7F2;
        margin: 0;
        padding: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
    <div id="app-loader">
      <div class="wrap">
        <div class="spinner"></div>
        <div class="label">Caricamento...</div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
