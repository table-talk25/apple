<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>table2Talk · Mockup Video Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --surface: #1A1D24;
    --surface-2: #242833;
    --pr: #B54735;
    --pr-hover: #933829;
    --ac: #245C4A;
    --ac-bright: #34A874;
    --danger: #EA4335;
    --danger-hover: #D33426;
    --text: #F5F7FA;
    --muted: #9AA3B2;
    --border: rgba(255, 255, 255, 0.1);
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    --font-heading: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  :focus-visible { outline: 2px solid var(--ac-bright); outline-offset: 2px; }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    background: var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .main-area {
    position: relative;
    flex: 1;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1d222c 0%, var(--bg) 75%);
  }

  .remote-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1b222c 0%, #11141a 100%);
  }

  .remote-avatar-placeholder {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ac), #1b4638);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-heading);
    font-size: 2.2rem;
    font-weight: 700;
    box-shadow: 0 0 0 6px rgba(52, 168, 116, 0.28);
  }

  .speaking-pill {
    position: absolute;
    left: 20px;
    bottom: 104px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(15, 17, 21, 0.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(52, 168, 116, 0.45);
    font-size: 0.85rem;
    font-weight: 500;
  }

  .speaking-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ac-bright);
    box-shadow: 0 0 0 4px rgba(52, 168, 116, 0.25);
  }

  .top-bar {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top));
    left: 20px;
    right: 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }

  .top-group {
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 14px;
    border-radius: 999px;
    background: rgba(26, 29, 36, 0.82);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    font-size: 0.86rem;
    font-weight: 500;
  }

  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--pr);
  }

  .room-name {
    font-family: var(--font-heading);
    font-weight: 600;
    max-width: 240px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .timer {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    padding-left: 8px;
    border-left: 1px solid var(--border);
  }

  .quality-badge {
    color: var(--ac-bright);
    font-weight: 600;
    font-size: 0.78rem;
  }

  .icon-pill {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(26, 29, 36, 0.82);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s;
  }
  .icon-pill:hover { background: var(--surface-2); }

  .pip {
    position: absolute;
    right: 20px;
    bottom: 104px;
    z-index: 25;
    width: 220px;
    aspect-ratio: 16 / 10;
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    box-shadow: var(--shadow);
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pip-label {
    position: absolute;
    left: 10px;
    bottom: 8px;
    right: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.76rem;
    font-weight: 600;
    background: rgba(15, 17, 21, 0.68);
    padding: 4px 8px;
    border-radius: 8px;
  }

  .controls-wrap {
    position: absolute;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(26, 29, 36, 0.9);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .ctrl-btn {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    transition: background 0.18s, transform 0.15s;
  }
  .ctrl-btn:hover { background: #313746; transform: translateY(-1px); }
  .ctrl-btn.active { background: var(--ac); color: #fff; }
  .ctrl-btn.off { background: var(--danger); color: #fff; }
  .ctrl-btn.leave {
    width: 60px;
    border-radius: 999px;
    background: var(--danger);
    color: #fff;
  }
  .ctrl-btn.leave:hover { background: var(--danger-hover); }

  .badge-count {
    position: absolute;
    top: -3px;
    right: -3px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--pr);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .side-panel {
    width: 340px;
    height: 100%;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 35;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
  }

  .tabs {
    display: flex;
    gap: 6px;
    background: var(--bg);
    padding: 4px;
    border-radius: 10px;
  }

  .tab {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
  }
  .tab.active { background: var(--surface-2); color: var(--text); }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .participant-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--surface-2);
  }

  .p-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--pr);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    flex: none;
  }
  .p-avatar.host { background: var(--ac); }

  .p-meta { flex: 1; min-width: 0; }
  .p-name { font-size: 0.9rem; font-weight: 600; }
  .p-role { font-size: 0.74rem; color: var(--muted); }
  .p-speaking { color: var(--ac-bright); font-weight: 600; }

  @media (max-width: 720px) {
    .pip { width: 124px; bottom: 96px; right: 12px; }
    .controls-wrap { gap: 8px; padding: 8px 12px; }
    .ctrl-btn { width: 42px; height: 42px; }
    .ctrl-btn.leave { width: 52px; }
    .side-panel { position: fixed; inset: 0; width: 100%; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="main-area">
      <div class="remote-video">
        <div class="remote-avatar-placeholder">MR</div>
      </div>

      <div class="top-bar">
        <div class="top-group">
          <div class="pill">
            <span class="brand-dot"></span>
            <span class="room-name">Cena Toscana · table2Talk</span>
            <span class="timer">12:34</span>
          </div>
          <div class="pill quality-badge">● HD · Ottima</div>
        </div>
        <div class="top-group">
          <button class="icon-pill" aria-label="Informazioni stanza">ℹ</button>
          <button class="icon-pill" aria-label="Schermo intero">⛶</button>
        </div>
      </div>

      <div class="speaking-pill">
        <span class="speaking-dot"></span>
        <span>Marco Rossi · Sta parlando</span>
      </div>

      <div class="pip" aria-label="Anteprima video locale">
        <span style="color:var(--muted);font-size:0.8rem">Self-view</span>
        <div class="pip-label">
          <span>Tu</span>
          <span>🎤</span>
        </div>
      </div>

      <div class="controls-wrap" role="toolbar" aria-label="Controlli videochiamata">
        <button class="ctrl-btn" aria-label="Microfono">🎤</button>
        <button class="ctrl-btn" aria-label="Fotocamera">📹</button>
        <button class="ctrl-btn" aria-label="Condividi schermo">🖥</button>
        <button class="ctrl-btn" aria-label="Chat">💬</button>
        <button class="ctrl-btn active" aria-label="Partecipanti">
          👥
          <span class="badge-count">2</span>
        </button>
        <button class="ctrl-btn leave" aria-label="Esci dalla chiamata">📞</button>
      </div>
    </div>

    <aside class="side-panel" aria-label="Pannello laterale">
      <div class="panel-header">
        <div class="tabs">
          <button class="tab">Chat</button>
          <button class="tab active">Partecipanti (2)</button>
        </div>
        <button class="icon-pill" style="width:32px;height:32px" aria-label="Chiudi pannello">✕</button>
      </div>
      <div class="panel-body">
        <div class="participant-row">
          <div class="p-avatar host">MR</div>
          <div class="p-meta">
            <div class="p-name">Marco Rossi</div>
            <div class="p-role">Organizzatore · <span class="p-speaking">Sta parlando</span></div>
          </div>
          <span>🎤</span>
        </div>
        <div class="participant-row">
          <div class="p-avatar">TU</div>
          <div class="p-meta">
            <div class="p-name">Tu</div>
            <div class="p-role">Partecipante</div>
          </div>
          <span>🎤</span>
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
